<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON ARENA</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0a;color:#fff;font-family:'Roboto',sans-serif;}
  canvas{display:block;}
  /* Neon glass overlay */
  #glassOverlay{
    position:absolute;top:0;left:0;width:800px;height:500px;pointer-events:none;
    background:rgba(10,10,10,0.2);backdrop-filter:blur(6px) brightness(1.2);
    transition:background .2s;
  }
  #glassOverlay:hover{background:rgba(30,0,80,0.15);}
  /* HUD */
  #hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;font-size:18px;z-index:2;}
  #hud .score{font-weight:bold;}
  #hud .timer{font-family:monospace;}
  /* Buttons */
  .btn{cursor:pointer;background:#222;border:none;color:#0ff;padding:6px 10px;margin:4px;border-radius:4px;z-index:2;}
  .btn:hover{background:#333;}
  #muteBtn{position:absolute;bottom:10px;right:10px;}
  #fullScreenBtn{position:absolute;bottom:10px;right:100px;}
  #modeBtn{position:absolute;bottom:10px;right:210px;}
  /* Settings modal */
  #settingsModal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#111;padding:20px;border:2px solid #0ff;border-radius:8px;display:none;z-index:5;}
  #settingsModal label{display:block;margin-top:8px;color:#0ff;}
  #settingsModal input[type=range]{width:200px;}
  #settingsModal input[type=color]{width:60px;height:30px;padding:0;border:none;}
  #closeSettings{margin-top:15px;background:#600;}
  #gearBtn{position:absolute;top:10px;right:10px;cursor:pointer;background:none;border:none;color:#0ff;font-size:24px;}
  /* Neon background animation */
  @keyframes neonPulse{0%{box-shadow:0 0 5px #0ff,0 0 10px #0ff;}50%{box-shadow:0 0 15px #0ff,0 0 30px #0ff;}100%{box-shadow:0 0 5px #0ff,0 0 10px #0ff;}}
  #hud,.btn{animation:neonPulse 2s infinite;}
</style>
</head>
<body>
<div id="hud">
  <div class="mode">Mode: <span id="modeName">Air Hockey</span></div>
  <div class="score">🟦 <span id="p1Score">0</span> – <span id="p2Score">0</span> 🟪</div>
  <div class="timer">⏱ <span id="timer">60</span>s</div>
</div>
<button id="gearBtn" class="btn">⚙️</button>
<button id="muteBtn" class="btn">🔇 Mute</button>
<button id="fullScreenBtn" class="btn">⛶ Fullscreen</button>
<button id="modeBtn" class="btn">Switch Mode</button>
<div id="glassOverlay"></div>

<div id="settingsModal">
  <h3 style="color:#0ff; margin:0;">Settings</h3>
  <label>Red Target <input type="color" id="redTarget" value="#ff0000"></label>
  <label>Blue Target <input type="color" id="blueTarget" value="#0000ff"></label>
  <label>Colour Tolerance <input type="range" id="tolerance" min="0" max="200" value="80"></label>
  <span id="tolVal" style="color:#0ff; margin-left:8px;">80</span>
  <label>Difficulty
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </label>
  <button id="closeSettings" class="btn">Close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/*** GLOBAL STATE ***/
let video, ctx;
let handLandmarks = [];
let calibrated = false;
let playerHands = [null,null]; // which hand index belongs to each player
let playerColorTargets = [{r:255,g:0,b:0},{r:0,g:0,b:255}]; // default red / blue
let colourTolerance = 80; // Euclidean distance threshold
let paddlePos = [{x:100,y:250},{x:700,y:250}];
let paddlePrev = [{x:100,y:250},{x:700,y:250}];
let ball = {x:400,y:250,vx:4,vy:2,r:12,trail:[]};
let scores = [0,0];
let mode = 0; // 0 = Air Hockey, 1 = Table Tennis
let timerSec = 60;
let gameRunning = false;
let mute = false;
let difficulty = 'medium';
/*** AUDIO ***/
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audio = new AudioCtx();
function beep(freq,dur=0.08){ if(mute) return; const o=audio.createOscillator(); const g=audio.createGain(); o.type='square'; o.frequency.value=freq; o.connect(g); g.connect(audio.destination); o.start(); g.gain.setValueAtTime(0.2,audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+dur); o.stop(audio.currentTime+dur); }
function thud(){ beep(120,0.12); }
function scoreChime(){ beep(800,0.15); beep(1000,0.15); beep(1200,0.15); }
/*** SETUP ***/
function setup(){
  createCanvas(800,500);
  ctx = canvas.drawingContext;
  frameRate(60);
  // video capture
  video = createCapture(VIDEO);
  video.size(800,500);
  video.hide();
  // MediaPipe Hands
  const hands = new Hands({
    locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.7});
  hands.onResults(r=>{ handLandmarks = r.multiHandLandmarks || []; });
  const cam = new Camera(video.elt,{onFrame: async()=>{ await hands.send({image: video.elt}); },width:800,height:500});
  cam.start();
  // UI hooks
  document.getElementById('muteBtn').onclick=()=>{ mute=!mute; this.textContent=mute?'🔈 Unmute':'🔇 Mute'; };
  document.getElementById('fullScreenBtn').onclick=()=>{document.documentElement.requestFullscreen();};
  document.getElementById('modeBtn').onclick=toggleMode;
  document.getElementById('gearBtn').onclick=()=>{document.getElementById('settingsModal').style.display='block';};
  document.getElementById('closeSettings').onclick=()=>{document.getElementById('settingsModal').style.display='none';};
  document.getElementById('redTarget').oninput=e=>{playerColorTargets[0]=hexToRgb(e.target.value);};
  document.getElementById('blueTarget').oninput=e=>{playerColorTargets[1]=hexToRgb(e.target.value);};
  document.getElementById('tolerance').oninput=e=>{colourTolerance=parseInt(e.target.value);document.getElementById('tolVal').textContent=e.target.value;};
  document.getElementById('difficulty').onchange=e=>{difficulty=e.target.value;applyDifficulty();};
  applyDifficulty();
  // keyboard shortcuts
  window.addEventListener('keydown',e=>{ if(e.key==='m'||e.key==='M') toggleMode(); if(e.key===' ') { if(!gameRunning && calibrated) startGame(); } });
}
/*** DIFFICULTY SETTINGS ***/
function applyDifficulty(){
  if(difficulty==='easy'){ ball.vx=3; ball.vy=2; paddleLerp=0.15; }
  else if(difficulty==='medium'){ ball.vx=4; ball.vy=2; paddleLerp=0.2; }
  else { ball.vx=5; ball.vy=3; paddleLerp=0.25; }
}
let paddleLerp = 0.2; // will be overwritten by applyDifficulty
/*** DRAW LOOP ***/
function draw(){
  background(0,15,30);
  image(video,0,0,800,500); // webcam feed

  if(!calibrated){
    drawHandBoxes(true);
    fill('#0ff'); noStroke(); textSize(20); textAlign(CENTER,CENTER);
    text('Place RED glove on left & BLUE glove on right.\nPress SPACE when ready.',width/2,height-30);
    if(keyIsPressed && key===' ') calibrateHands();
    return;
  }

  if(!gameRunning){
    drawHandBoxes(false);
    fill('#0ff'); textSize(24); textAlign(CENTER,CENTER);
    text('Press SPACE to PLAY',width/2,height/2);
    return;
  }

  // timer
  if(frameCount%60===0 && timerSec>0){ timerSec--; document.getElementById('timer').textContent=timerSec; }
  if(timerSec===0) endGame();

  // input & physics
  updatePaddles();
  moveBall();
  handleCollisions();

  // render
  drawGlassOverlay();
  drawPaddles();
  drawBall();
  drawParticles();
  drawHandBoxes(false);
}
/*** CALIBRATION ***/
function calibrateHands(){
  if(handLandmarks.length<2) return;
  const colors = handLandmarks.map(l=>averageHandColor(l));
  const d0 = colourDist(colors[0],playerColorTargets[0]);
  const d1 = colourDist(colors[1],playerColorTargets[0]);
  // assign based on which is closer to red target
  if(d0<d1){ playerHands=[0,1]; } else { playerHands=[1,0]; }
  calibrated=true;
}
/*** HAND BOXES ***/
function drawHandBoxes(coloured){
  handLandmarks.forEach((lm,idx)=>{
    const box=handBoundingBox(lm);
    const col= coloured && calibrated ? (idx===playerHands[0]?color(0,0,255):color(255,0,255)) : color(0,255,0);
    noFill(); stroke(col); strokeWeight(2); rect(box.x,box.y,box.w,box.h);
  });
}
/*** UTILITIES ***/
function handBoundingBox(lms){
  let minX=1,minY=1,maxX=0,maxY=0;
  lms.forEach(p=>{if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y;});
  return {x:minX*width, y:minY*height, w:(maxX-minX)*width, h:(maxY-minY)*height};
}
function averageHandColor(lms){
  const b=handBoundingBox(lms);
  const img=ctx.getImageData(b.x,b.y,b.w,b.h);
  let r=0,g=0,bl=0,cnt=0;
  for(let i=0;i<img.data.length;i+=4){ r+=img.data[i]; g+=img.data[i+1]; bl+=img.data[i+2]; cnt++; }
  return {r:r/cnt|0, g:g/cnt|0, b:bl/cnt|0};
}
function colourDist(c1,c2){ return Math.hypot(c1.r-c2.r,c1.g-c2.g,c1.b-c2.b); }
function hexToRgb(hex){
  const h=hex.replace('#','');
  const bigint=parseInt(h,16);
  return {r:(bigint>>16)&255, g:(bigint>>8)&255, b:bigint&255};
}
/*** PADDLE UPDATE ***/
function updatePaddles(){
  if(handLandmarks.length===0) return;
  const tipIdx=8; // index finger tip
  handLandmarks.forEach((lm,handIdx)=>{
    const pt=lm[tipIdx];
    const px=pt.x*width; const py=pt.y*height;
    const player = (handIdx===playerHands[0])?0:1;
    // lerp for smooth motion
    paddlePrev[player].x=paddlePos[player].x; paddlePrev[player].y=paddlePos[player].y;
    paddlePos[player].x=lerp(paddlePos[player].x,px,paddleLerp);
    paddlePos[player].y=lerp(paddlePos[player].y,py,paddleLerp);
    // constraints per mode
    if(mode===0){ // Air Hockey, stay within half
      const half=player===0?0:width/2;
      paddlePos[player].x=constrain(paddlePos[player].x,half+30,half+width/2-30);
      paddlePos[player].y=constrain(paddlePos[player].y,30,height-30);
    } else { // Table Tennis, locked to left/right edge
      paddlePos[player].x=player===0?30:width-30;
      paddlePos[player].y=constrain(paddlePos[player].y,30,height-30);
    }
  });
}
/*** BALL PHYSICS ***/
function moveBall(){
  ball.x+=ball.vx; ball.y+=ball.vy;
  if(ball.y<ball.r||ball.y>height-ball.r){ ball.vy*=-1; thud(); }
}
function handleCollisions(){
  // goal detection
  if(ball.x<-ball.r){ scores[1]++; scoreChime(); resetBall(); }
  if(ball.x>width+ball.r){ scores[0]++; scoreChime(); resetBall(); }
  // paddle collisions
  paddlePos.forEach((p,i)=>{
    const dx=ball.x-p.x; const dy=ball.y-p.y; const dist=Math.hypot(dx,dy);
    const radius = mode===0?30:20;
    if(dist<ball.r+radius){
      const angle=Math.atan2(dy,dx);
      const speed=Math.hypot(ball.vx,ball.vy);
      ball.vx=speed*Math.cos(angle);
      ball.vy=speed*Math.sin(angle);
      const overlap=ball.r+radius-dist;
      ball.x+=Math.cos(angle)*overlap;
      ball.y+=Math.sin(angle)*overlap;
      thud();
    }
  });
  // HUD update & win check
  document.getElementById('p1Score').textContent=scores[0];
  document.getElementById('p2Score').textContent=scores[1];
  if(scores[0]===3||scores[1]===3) endGame();
}
/*** BALL RESET ***/
function resetBall(){
  ball.x=width/2; ball.y=height/2;
  // launch toward player who just conceded
  const dir = scores[0]===3?1:-1; // if P1 already won, send to P2
  ball.vx=dir*(3+random(2));
  ball.vy=random(-2,2);
  ball.trail=[];
}
/*** DRAWING ***/
function drawPaddles(){
  // Player 1 – blue
  fill(0,120,255); noStroke();
  if(mode===0) ellipse(paddlePos[0].x,paddlePos[0].y,60); else rect(paddlePos[0].x-5,paddlePos[0].y-40,10,80);
  // Player 2 – magenta
  fill(255,0,200);
  if(mode===0) ellipse(paddlePos[1].x,paddlePos[1].y,60); else rect(paddlePos[1].x-5,paddlePos[1].y-40,10,80);
}
function drawBall(){
  // trail
  ball.trail.push({x:ball.x,y:ball.y,alpha:255});
  if(ball.trail.length>15) ball.trail.shift();
  ball.trail.forEach(p=>{ fill(255,255,100,p.alpha); noStroke(); ellipse(p.x,p.y,ball.r); p.alpha-=15; });
  // ball
  fill(255,200,0); noStroke(); ellipse(ball.x,ball.y,ball.r*2);
}
function drawParticles(){ /* placeholder for future particle bursts */ }
function drawGlassOverlay(){ /* CSS handled */ }
/*** GAME CONTROL ***/
function startGame(){
  gameRunning=true; timerSec=60; scores=[0,0]; document.getElementById('timer').textContent=timerSec; resetBall();
}
function endGame(){
  gameRunning=false; const winner=scores[0]>scores[1]?'🟦 Player 1':'🟪 Player 2';
  fill('#0ff'); textSize(32); textAlign(CENTER,CENTER); text(`${winner} Wins!`,width/2,height/2-30);
  textSize(20); text('Press SPACE to replay',width/2,height/2+20);
}
/*** MODE SWITCH ***/
function toggleMode(){
  mode=(mode+1)%2; const name=mode===0?'Air Hockey':'Table Tennis'; document.getElementById('modeName').textContent=name;
  // reset paddle positions for new mode
  paddlePos[0]={x:mode===0?100:30,y:250}; paddlePos[1]={x:mode===0?700:770,y:250}; paddlePrev=JSON.parse(JSON.stringify(paddlePos));
}
</script>
</body>
</html>
